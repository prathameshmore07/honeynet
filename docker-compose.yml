version: '3.8'

# ==============================================================================
# HoneyNet Multi-Container Orchestration (M4 Hardware Optimized)
# Strict memory caps: Total Docker footprint < 3GB RAM (within 16GB limit)
# Native Ollama runs on host macOS for Metal/MLX hardware acceleration
# ==============================================================================

services:
  # 1. Cowrie SSH / Telnet Honeypot Container
  cowrie:
    image: cowrie/cowrie:latest
    container_name: honeynet-cowrie
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - ./cowrie_logs:/cowrie/cowrie-data/log/cowrie
      - ./cowrie_config/cowrie.cfg:/cowrie/cowrie-data/cowrie.cfg
      - ./cowrie_config/honeyfs:/cowrie/cowrie-data/honeyfs
    environment:
      - COWRIE_HONEYFS=/cowrie/cowrie-data/honeyfs
    networks:
      - honeynet-internal

  # 2. MongoDB 7.0 (Official Document Store)
  mongodb:
    image: mongo:7.0
    container_name: honeynet-mongo
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping:1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - honeynet-internal

  # 3. HoneyNet FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: honeynet-backend
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      mongodb:
        condition: service_healthy
      cowrie:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/honeynet_db
      - DATABASE_URL=mongodb://mongodb:27017/honeynet_db
      - COWRIE_LOG_PATH=/app/cowrie_logs/cowrie.json
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cowrie_logs:/app/cowrie_logs
      - ./cowrie_config:/app/cowrie_config
      - ./templates:/app/templates
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - honeynet-internal

  # 4. Next.js SOC Forensics Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: honeynet-frontend
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    networks:
      - honeynet-internal

networks:
  honeynet-internal:
    driver: bridge

volumes:
  mongo_data:
