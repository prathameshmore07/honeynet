name: HoneyNet CI / Build & Typecheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Lint & Unit Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Audit Suite
        env:
          MONGO_URI: "mongodb://localhost:27017/honeynet_db"
          WS_AUTH_TOKEN: "honeynet_soc_token_2026"
        run: |
          PYTHONPATH=. pytest -v tests/test_audit.py

  frontend-build:
    name: Frontend TypeScript Strict Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Strict Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit
