name: HoneyNet CI / Build & Typecheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Lint & Unit Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Module Imports & Schema Initialization
        run: |
          python -c "from backend.db import init_db; init_db(); from backend.main import app; from backend.classifier import classify_command; cat, method = classify_command('cat .env'); assert cat == 'git'; print('Backend Verification Passed!')"

  frontend-build:
    name: Frontend TypeScript Strict Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Production Build & Strict TypeScript Compilation
        working-directory: ./frontend
        run: npm run build
