[honeypot]
hostname = srv-prod-core-01
log_path = /cowrie/cowrie-data/log/cowrie
download_path = /cowrie/cowrie-data/downloads
contents_path = /cowrie/cowrie-data/downloads
honeyfs = /cowrie/cowrie-data/honeyfs
filesystem = /cowrie/cowrie-data/fs.pickle
auth_class = AuthRandom
auth_random_max = 1

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = /cowrie/cowrie-data/log/cowrie/cowrie.json
epoch_timestamp = false
